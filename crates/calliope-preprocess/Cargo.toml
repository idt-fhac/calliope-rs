[package]
name = "calliope-preprocess"
description = "Model definition to input dataset: templates, scenarios, data tables, time (Calliope preprocess/*)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
calliope-array.workspace = true
calliope-math = { path = "../calliope-math" }
calliope-schema.workspace = true
calliope-yaml.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
geographiclib-rs = "0.2.7"
indexmap.workspace = true
csv = "1.3"
parquet = { version = "60", default-features = false, features = ["snap"], optional = true }
regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[features]
default = ["parquet"]
# Parquet data tables (as written by `pandas.DataFrame.to_parquet`, snappy or uncompressed).
parquet = ["dep:parquet", "dep:serde_json"]

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
