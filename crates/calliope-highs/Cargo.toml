[package]
name = "calliope-highs"
description = "HiGHS solver backend for calliope-lp models: safe FFI wrapper, solve, results, in-place updates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
calliope-lp = { path = "../calliope-lp" }
# Bundles HiGHS 1.15.0 and builds it with cmake; bindgen needs libclang (LIBCLANG_PATH).
highs-sys = { version = "=1.15.0", default-features = false, features = ["build", "highs_release"] }
thiserror.workspace = true

# FFI crate: same lints as the workspace, except that `unsafe` is allowed (only in `ffi.rs`).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
